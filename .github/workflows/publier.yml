      - name: Ce qui empêche de ranger se dit, le rangement se force, le courriel mène à la correction
        working-directory: /tmp/wp
        run: |
          wp eval '
            $echecs = array();
            if ( "" !== Notice_Archeomed_Rangement::ce_qui_bloque() ) { $echecs[] = "un blocage sans raison : " . Notice_Archeomed_Rangement::ce_qui_bloque(); }
            $sans = function ( $o ) { $o = (array) $o; $o["numero"] = ""; return $o; };
            add_filter( "option_notice_archeomed_options", $sans );
            $b = Notice_Archeomed_Rangement::ce_qui_bloque();
            if ( "aucun numéro n’est réglé" !== $b ) { $echecs[] = "sans numéro : « " . $b . " »"; }
            $ids = get_posts( array( "post_type" => "na_notice", "post_status" => "private", "posts_per_page" => 1, "fields" => "ids" ) );
            $id  = (int) $ids[0];
            update_post_meta( $id, "_na_sdrive_apres", time() + 3600 );
            $admin = get_users( array( "role" => "administrator", "number" => 1, "fields" => "ID" ) );
            wp_set_current_user( (int) $admin[0] );
            ob_start(); Notice_Archeomed_Rangement::signaler_le_blocage(); $bandeau = ob_get_clean();
            if ( false === strpos( $bandeau, "aucun numéro n’est réglé" ) ) { $echecs[] = "pas de bandeau : " . $bandeau; }
            $r = Notice_Archeomed_Rangement::ranger_maintenant();
            if ( ! empty( $r["ok"] ) || false === strpos( $r["message"], "Rien ne peut se ranger" ) ) { $echecs[] = "forcer sans numéro : " . wp_json_encode( $r ); }
            remove_filter( "option_notice_archeomed_options", $sans );
            $m = new ReflectionMethod( "Notice_Archeomed_Settings", "etat_sdrive" );
            $m->setAccessible( true );
            ob_start(); $m->invoke( null ); $page = ob_get_clean();
            if ( false === strpos( $page, "sdrive_ranger" ) ) { $echecs[] = "pas de bouton « Ranger maintenant »"; }
            $r = Notice_Archeomed_Rangement::ranger_maintenant();
            if ( empty( $r["message"] ) || false !== strpos( $r["message"], "Rien ne peut se ranger" ) ) { $echecs[] = "forcer : " . wp_json_encode( $r ); }
            if ( (int) get_post_meta( $id, "_na_sdrive_apres", true ) > time() + 120 ) { $echecs[] = "la notice reportée n’est pas redevenue due"; }
            echo "Ranger maintenant : ", $r["message"], "\n";
            $p = $GLOBALS["notice_archeomed_plugin"];
            $c = new ReflectionMethod( $p, "correction_pour_la_redaction" );
            $c->setAccessible( true );
            $lien = $c->invoke( $p, $id );
            if ( false === strpos( $lien, "na_corriger=1" ) || false === strpos( $lien, "post=" . $id ) ) { $echecs[] = "le lien de correction du courriel : " . $lien; }
            $ecrire = $c->invoke( $p, $id, array( "resp_email" => "a@exemple.fr", "coresp_email" => "b+x@exemple.fr", "coauteur_email" => "a@exemple.fr", "deposant_email" => "pas une adresse" ), "[CORRIGÉE] Notice Archéomed - Caen (14)" );
            if ( false === strpos( $ecrire, "mailto:a@exemple.fr,b%2Bx@exemple.fr?subject=Notice%20Arch" ) || false !== strpos( $ecrire, "CORRIG" ) || false === strpos( $ecrire, "Écrire aux responsables" ) ) { $echecs[] = "le lien vers les responsables : " . $ecrire; }
            $deux = array();
            foreach ( array( "V. Installations artisanales", "V. Installations artisanales", "IV. Sépultures et nécropoles", "" ) as $i => $rub ) {
              $n = wp_insert_post( array( "post_type" => "na_notice", "post_status" => "private", "post_title" => "Homonyme " . $i ) );
              update_post_meta( $n, "_na_donnees", array( "commune" => "Saint-Lô", "rubrique_principale" => $rub, "rubrique_matiere" => "b" ) );
              $deux[] = $n;
            }
            $noms = array_map( array( "Notice_Archeomed_Rangement", "dossier_de" ), $deux );
            if ( ! preg_match( "#/originaux/V_Installations_artisanales/B_Carrieres_mines_et_metallurgie/Saint_Lo$#", $noms[0] )
              || ! preg_match( "#/originaux/V_Installations_artisanales/B_Carrieres_mines_et_metallurgie/Saint_Lo_2$#", $noms[1] )
              || ! preg_match( "#/originaux/IV_Sepultures_et_necropoles/Saint_Lo$#", $noms[2] ) || ! preg_match( "#/originaux/Sans_rubrique/Saint_Lo$#", $noms[3] )
              || Notice_Archeomed_Rangement::dossier_de( $deux[0] ) !== $noms[0] ) { $echecs[] = "les dossiers par rubrique et par commune : " . wp_json_encode( $noms ); }
            foreach ( $deux as $n ) { wp_delete_post( $n, true ); }
            foreach ( $echecs as $e ) { echo "::error::", $e, "\n"; }
            if ( $echecs ) { exit( 1 ); }
            echo "Blocage dit, rangement forcé, lien de correction posé.\n";'

      - name: Une panne de sDrive ne coûte d'essai à aucune notice, un mot de passe refusé arrête le rangement
        working-directory: /tmp/wp
        run: |
          wp eval '
            $echecs = array();
            $ids = get_posts( array( "post_type" => "na_notice", "post_status" => "any", "posts_per_page" => 2, "fields" => "ids",
              "meta_key" => "_na_etat", "meta_value" => "envoyee" ) );
            if ( 2 !== count( $ids ) ) { echo "::error::deux notices envoyées attendues\n"; exit( 1 ); }
            // Le Word de leur version est à refaire : le passage déposera.
            foreach ( $ids as $n ) {
              $t = Notice_Archeomed_Rangement::table_de( $n );
              unset( $t[ "word:v" . max( 1, (int) get_post_meta( $n, "_na_version", true ) ) ] );
              update_post_meta( $n, "_na_sdrive", $t );
              delete_post_meta( $n, "_na_sdrive_essais" );
              update_post_meta( $n, "_na_sdrive_apres", time() - 10 );
            }
            $essais = function () use ( $ids ) {
              $e = array();
              foreach ( $ids as $n ) { wp_cache_delete( $n, "post_meta" ); $e[] = (int) get_post_meta( $n, "_na_sdrive_essais", true ); }
              return $e;
            };
            $etat = function () { wp_cache_delete( Notice_Archeomed_Rangement::ETAT, "options" ); $e = get_option( Notice_Archeomed_Rangement::ETAT ); return (string) $e["raison"]; };

            file_put_contents( "/tmp/sdrive.panne", "PUT 507" );
            Notice_Archeomed_Rangement::en_tache();
            $prochain = (int) wp_next_scheduled( Notice_Archeomed_Rangement::HOOK );
            if ( array( 0, 0 ) !== $essais() ) { $echecs[] = "le compte plein a coûté des essais : " . wp_json_encode( $essais() ); }
            if ( false === strpos( $etat(), "507" ) ) { $echecs[] = "le compte plein ne se dit pas : " . $etat(); }
            if ( $prochain < time() + 50 * MINUTE_IN_SECONDS ) { $echecs[] = "le compte plein ne repousse pas le passage d’une heure"; }
            echo "Compte plein : ", $etat(), "\n";

            file_put_contents( "/tmp/sdrive.panne", "* 401" );
            foreach ( array( 1, 2, 3 ) as $i ) {
              wp_clear_scheduled_hook( Notice_Archeomed_Rangement::HOOK );
              Notice_Archeomed_Rangement::en_tache();
            }
            wp_cache_delete( Notice_Archeomed_Sdrive::REFUS, "options" );
            if ( ! Notice_Archeomed_Sdrive::refusee() ) { $echecs[] = "trois refus du mot de passe n’arrêtent pas le rangement"; }
            if ( wp_next_scheduled( Notice_Archeomed_Rangement::HOOK ) ) { $echecs[] = "le rangement refusé repasse encore"; }
            if ( false === strpos( Notice_Archeomed_Rangement::ce_qui_bloque(), "401" ) ) { $echecs[] = "le refus ne se dit pas : " . Notice_Archeomed_Rangement::ce_qui_bloque(); }
            if ( array( 0, 0 ) !== $essais() ) { $echecs[] = "les refus ont coûté des essais : " . wp_json_encode( $essais() ); }
            echo "Mot de passe refusé : ", Notice_Archeomed_Rangement::ce_qui_bloque(), "\n";

            unlink( "/tmp/sdrive.panne" );
            $r = Notice_Archeomed_Rangement::ranger_maintenant();
            wp_cache_delete( Notice_Archeomed_Sdrive::REFUS, "options" );
            if ( Notice_Archeomed_Sdrive::refusee() ) { $echecs[] = "« Ranger maintenant » ne lève pas l’arrêt"; }
            foreach ( $ids as $n ) {
              wp_cache_delete( $n, "post_meta" );
              if ( "" !== (string) get_post_meta( $n, "_na_sdrive_apres", true ) ) { $echecs[] = "la notice " . $n . " attend encore : " . wp_json_encode( $r ); }
            }
            foreach ( $echecs as $e ) { echo "::error::", $e, "\n"; }
            if ( $echecs ) { exit( 1 ); }
            echo "Panne sans essai perdu, refus arrêté puis repris : ", $r["message"], "\n";'

      - name: Le Word de relecture rejoint le dossier de sa notice sur sDrive, et une panne de sDrive ne coûte pas la correction
        working-directory: /tmp/wp
        run: |
          wp eval '
            require_once ABSPATH . "wp-admin/includes/user.php";
            $echecs = array();
            $R = "Notice_Archeomed_Relecture";
            $R::assurer_les_roles();
            $ids = get_posts( array( "post_type" => "na_notice", "post_status" => "private", "posts_per_page" => 1, "fields" => "ids",
              "meta_key" => "_na_etat", "meta_value" => "envoyee" ) );
            if ( 1 !== count( $ids ) ) { echo "::error::une notice envoyée attendue\n"; exit( 1 ); }
            $id = (int) $ids[0];
            $compte = (int) wp_insert_user( array( "user_login" => "relectrice", "user_pass" => wp_generate_password( 24 ),
              "user_email" => "relectrice@example.org", "display_name" => "Jeanne Martin", "role" => $R::ROLE_DIRECTION ) );
            $R::regler( true, array() );
            $version = max( 1, (int) get_post_meta( $id, "_na_version", true ) );
            $attendus = function () use ( $id ) { wp_cache_delete( $id, "post_meta" ); return array_map( "intval", (array) get_post_meta( $id, "_na_relecture_a_deposer", false ) ); };

            // sDrive refuse les dépôts : la correction s’enregistre quand même.
            file_put_contents( "/tmp/sdrive.panne", "PUT 507" );
            $_POST = wp_slash( array( "lieu_dit" => "Relu sur le site" ) );
            $r = $R::enregistrer( $id, $version, $compte );
            $_POST = array();
            if ( "enregistree" !== $r["issue"] || $version + 1 !== (int) $r["version"] ) { echo "::error::la relecture ne s’enregistre pas : ", wp_json_encode( $r ), "\n"; exit( 1 ); }
            wp_clear_scheduled_hook( $R::HOOK );
            $R::en_tache();
            $d = get_post_meta( $id, "_na_donnees", true );
            if ( "Relu sur le site" !== $d["lieu_dit"] ) { $echecs[] = "la correction n’est pas dans la notice : " . $d["lieu_dit"]; }
            if ( array( $version + 1 ) !== $attendus() ) { $echecs[] = "le Word n’attend plus sDrive après la panne : " . wp_json_encode( $attendus() ); }
            if ( 0 !== (int) get_post_meta( $id, "_na_relecture_essais", true ) ) { $echecs[] = "la panne de sDrive a coûté un essai"; }
            if ( ! wp_next_scheduled( $R::HOOK ) ) { $echecs[] = "après la panne, aucun passage n’est réservé"; }

            // sDrive revenu, le passage suivant dépose.
            unlink( "/tmp/sdrive.panne" );
            wp_clear_scheduled_hook( $R::HOOK );
            $R::en_tache();
            $dossier = (string) get_post_meta( $id, "_na_sdrive_dossier", true );
            $fichier = "/tmp/sdrive/Revue AM/" . $dossier . "/" . $R::nom_du_word( $id, $version + 1, "Jeanne Martin" );
            if ( array() !== $attendus() ) { $echecs[] = "le Word attend encore : " . get_post_meta( $id, "_na_relecture_raison", true ); }
            if ( "" === $dossier || ! is_file( $fichier ) ) { $echecs[] = "le Word de relecture n’est pas dans le dossier de la notice : " . $fichier; }
            else {
              $zip = new ZipArchive();
              $zip->open( $fichier );
              $xml = (string) $zip->getFromName( "word/document.xml" );
              $zip->close();
              if ( false === strpos( $xml, "<w:ins " ) || false === strpos( $xml, "<w:del " ) || false === strpos( $xml, "w:author=\"Jeanne Martin\"" ) ) { $echecs[] = "le Word déposé ne porte pas le suivi signé du relecteur"; }
              if ( false === simplexml_load_string( $xml ) ) { $echecs[] = "le Word déposé n’est pas un XML valide"; }
            }
            // Le Word net de la version suit, par le rangement.
            Notice_Archeomed_Rangement::ranger_maintenant();
            $table = Notice_Archeomed_Rangement::table_de( $id );
            if ( ! isset( $table[ "word:v" . ( $version + 1 ) ] ) ) { $echecs[] = "le Word net de la version relue n’est pas rangé"; }
            wp_delete_user( $compte );
            delete_option( $R::OPTION );
            foreach ( $echecs as $e ) { echo "::error::", $e, "\n"; }
            if ( $echecs ) { exit( 1 ); }
            echo "Word de relecture déposé : ", basename( $fichier ), "\n";'

      - name: Ce qui reste en route, quand la charge n'a pas passé
        if: failure()
        working-directory: /tmp/wp
        run: |
          (
          echo "— notices qui n'ont pas été expédiées :"
          wp eval 'foreach ( get_posts( array( "post_type" => "na_notice", "post_status" => "any", "posts_per_page" => 6, "fields" => "ids", "meta_query" => array( array( "key" => "_na_etat", "value" => "envoyee", "compare" => "!=" ) ) ) ) as $id ) { echo $id, " etat=", get_post_meta( $id, "_na_etat", true ), " essais=", get_post_meta( $id, "_na_essais", true ), " prise=", get_post_meta( $id, "_na_prise", true ), " prepa=", get_post_meta( $id, "_na_preparation", true ), " pas_avant=", get_post_meta( $id, "_na_pas_avant", true ), " erreur=", get_post_meta( $id, "_na_erreur", true ), "\n"; }' || true
          echo "— événements planifiés :"
          wp cron event list --format=table | head -40 || true
          echo "— premier passage du planificateur :"
          head -c 1200 /tmp/cron-1-1.log | tr '\n' ' ' || true
          echo "— rangement sur sDrive :"
          wp option get na_sdrive_etat --format=json || true
          tail -n 8 /tmp/sdrive.log 2>/dev/null || true
          echo "— export sur sDrive :"
          wp eval '$t = Notice_Archeomed_Export::travail(); if ( $t ) { unset( $t["figures"], $t["paquet"], $t["mesures"] ); } echo "en cours : ", wp_json_encode( $t ), "\nattente : ", wp_json_encode( Notice_Archeomed_Export::attente() ), "\n"; foreach ( Notice_Archeomed_Export::manifestes() as $n => $rs ) { foreach ( $rs as $r => $m ) { echo $n, " / ", $r, " : ", isset( $m["issue"] ) ? $m["issue"] : "?", " ", isset( $m["texte"] ) ? $m["texte"] : "", " — ", count( (array) $m["fichiers"] ), " fichiers\n"; } }' || true
          echo "— journal de WordPress :"
          tail -n 40 /tmp/wp/wp-content/debug.log 2>/dev/null || true
          ) 2>&1 | python3 -c 'import sys; [print("::error::" + l.rstrip("\n")[:600]) for l in sys.stdin if l.strip()]'

      - name: Aucune erreur fatale
        if: always()
        run: |
          for f in /tmp/serveur.log /tmp/faux-sdrive.log /tmp/wp/wp-content/debug.log; do
            [ -f "$f" ] || continue
            if grep -qE "PHP (Fatal|Parse) error|Allowed memory size" "$f"; then
              echo "::error::Erreur fatale dans $f"
              grep -E "PHP (Fatal|Parse) error|Allowed memory size" "$f" | head -5 | python3 -c 'import sys; [print("::error::" + l.rstrip("\n")[:400]) for l in sys.stdin]'
              exit 1
            fi
          done

  # Les couleurs des aperçus. Le serveur ramène au sRGB une illustration qui
  # porte un autre profil ; on l'éprouve ici sur un ImageMagick véritable,
  # séparément des autres travaux, dont Imagick changerait les chemins. Le
  # profil sRGB du plugin doit aussi être celui que son générateur écrit.
  couleurs:
    needs: analyser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Prendre le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3 avec Imagick
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick
          coverage: none

      - name: Le profil sRGB est celui du générateur
        run: |
          python3 .github/essais/profil-icc srgb /tmp/srgb.icc
          cmp /tmp/srgb.icc notice-archeomed/assets/srgb.icc

      - name: Les couleurs passent au sRGB
        run: |
          python3 .github/essais/profil-icc lineaire /tmp/lineaire.icc
          php .github/essais/couleurs.php /tmp/lineaire.icc

  publier:
    # Seule une étiquette publie, et seulement si le site d'essai a tenu.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyser, essayer, charger, couleurs]
    runs-on: ubuntu-latest
    permissions:
      # Le jeton fourni par GitHub suffit à créer une release : aucune clé à
      # déposer dans les secrets du dépôt.
      contents: write

    steps:
      - name: Prendre le code de l'étiquette
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe avant de publier
        run: ./verifier-la-syntaxe notice-archeomed/*.php

      - name: Vérifier que l'étiquette dit la même version que le plugin
        run: |
          set -eu
          ENTETE=$(sed -n 's/^ \* Version: *//p' notice-archeomed/notice-archeomed.php | head -1)
          ETIQUETTE="${GITHUB_REF_NAME#v}"
          echo "en-tête : $ENTETE — étiquette : $ETIQUETTE"
          if [ "$ENTETE" != "$ETIQUETTE" ]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas au « Version: $ENTETE » de l'en-tête."
            echo "WordPress compare les numéros de l'en-tête : publier ces deux-là ferait annoncer une version que l'archive ne porte pas."
            exit 1
          fi

      - name: Fabriquer l'archive
        run: ./empaqueter

      - name: Publier la release avec son archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" notice-archeomed.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(git log -1 --pretty=%B)"

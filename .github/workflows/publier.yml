# Publie une release dès qu'une étiquette de version est poussée.
#
# Le dépôt n'est pas dans le répertoire de WordPress : pour qu'une correction
# parvienne au site, il faut une release portant l'archive d'installation.
# La fabriquer et la déposer à la main, c'est cinq gestes dans une interface,
# et autant d'occasions de joindre la mauvaise archive ou d'oublier le
# fichier — auquel cas le plugin se tait, à juste titre, et l'on cherche
# pourquoi.
#
# Ici, « git push --tags » suffit. L'archive est fabriquée par le même
# « ./empaqueter » que sur le poste de travail : c'est la garantie qu'elle a
# la racine « notice-archeomed/ » que WordPress attend, et non celle que
# GitHub produirait seul, qui installerait le plugin à côté de lui-même.

name: Publier une release

# Chaque envoi sur main passe l'analyse et le site d'essai : on sait qu'une
# version est bonne avant de l'étiqueter. Seule une étiquette publie.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # PHP lui-même, avant toute publication.
  #
  # Le poste qui prépare n'a pas PHP, et le contrôle maison ne voit que ce
  # qu'il sait chercher. Les machines de GitHub l'ont : chaque fichier passe
  # ici l'analyseur de PHP, sous la plus ancienne version que l'en-tête
  # promet (7.2) et sous une récente. C'est la dernière occasion d'arrêter
  # une version qui ne chargerait pas — après, elle est sur le site, et un
  # plugin qui ne charge pas n'entend plus les mises à jour : la suivante,
  # qui le réparerait, ne lui parvient pas. Il faut alors la téléverser à la
  # main.
  #
  # L'action qui installe PHP vient d'un tiers : elle tourne dans un travail
  # sans droit d'écriture, et celui qui publie attend qu'elle ait fini.
  analyser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        php: ['7.2', '8.3']
    steps:
      - name: Prendre le code de l'étiquette
        uses: actions/checkout@v4

      - name: Installer PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Chaque fichier passe l'analyseur de PHP
        run: |
          set -eu
          for f in notice-archeomed/*.php; do php -l "$f"; done

      - name: Le contrôle des doublons tranche juste
        run: .github/essais/verifier-les-doublons

  # Le site d'essai que la revue n'a pas.
  #
  # « Un passage vert ne dispense pas d'installer sur un site d'essai avant
  # la production. » La revue n'a que son site de production, où le
  # formulaire se teste sur une page cachée — mais une erreur fatale, elle,
  # n'est pas cachée : elle arrête le site entier. C'est ce qu'a fait la 3.29,
  # dont chaque fichier était pourtant valide pour PHP pris un à un.
  #
  # Ici, un WordPress véritable se monte à chaque fois, avec sa base : le
  # plugin s'active, le formulaire s'affiche sur une vraie page, la file des
  # termes est éprouvée par PHP, le plugin se désactive. Le journal de
  # WordPress ne doit porter aucune erreur fatale. Rien n'interroge Pactols :
  # la publication ne dépend pas de la santé d'un service tiers.
  essayer:
    needs: analyser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # 7.2, parce que l'en-tête du plugin la promet : l'analyseur ne voit
        # que la syntaxe, et une fonction qui n'existe qu'en 8 ne se révèle
        # qu'à l'exécution — sur l'hébergement, en erreur fatale.
        php: ['7.2', '8.1', '8.3']
    services:
      base:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: essai
          MARIADB_DATABASE: essai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Prendre le code
        uses: actions/checkout@v4

      - name: Installer PHP ${{ matrix.php }} et WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          tools: wp-cli
          coverage: none

      - name: Monter un WordPress d'essai
        run: |
          set -eu
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --quiet
          wp config create --dbname=essai --dbuser=root --dbpass=essai \
            --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          # Un compte jetable, pour une base qui disparaît avec la machine.
          wp core install --url=http://127.0.0.1:8080 --title=Essai \
            --admin_user=essai --admin_password=essai-jetable \
            --admin_email=essai@example.org --skip-email
          cp -r "$GITHUB_WORKSPACE/notice-archeomed" wp-content/plugins/

      - name: Le plugin s'active
        working-directory: /tmp/wp
        run: wp plugin activate notice-archeomed

      - name: Le formulaire s'affiche sur une page
        working-directory: /tmp/wp
        run: |
          set -eu
          ID=$(wp post create --post_type=page --post_status=publish \
            --post_title=Formulaire --post_content='[notice_archeomed_pactols]' --porcelain)
          php -S 127.0.0.1:8080 > /tmp/serveur.log 2>&1 &
          sleep 2
          curl -fsS "http://127.0.0.1:8080/?page_id=$ID" -o /tmp/page.html
          if ! grep -q 'class="na-form"' /tmp/page.html; then
            echo "::error::La page ne porte pas le formulaire."
            head -c 3000 /tmp/page.html
            exit 1
          fi

      - name: La file des termes et le reste, éprouvés par PHP
        working-directory: /tmp/wp
        run: |
          # Une erreur fatale arrête l'essai avant qu'il ait pu dire quoi que
          # ce soit : ses dernières lignes sortent alors en annotations, qui
          # se lisent sans être connecté.
          if ! wp eval-file "$GITHUB_WORKSPACE/.github/essais/file-des-termes.php" > /tmp/essais.log 2>&1; then
            cat /tmp/essais.log
            tail -n 15 /tmp/essais.log | cut -c1-400 | sed 's/^/::error::/'
            exit 1
          fi
          cat /tmp/essais.log

      - name: Le plugin se désactive
        working-directory: /tmp/wp
        run: wp plugin deactivate notice-archeomed

      - name: Aucune erreur fatale au journal de WordPress
        if: always()
        run: |
          JOURNAL=/tmp/wp/wp-content/debug.log
          [ -f "$JOURNAL" ] || { echo "Journal vide."; exit 0; }
          echo "— ce que le journal dit du plugin :"
          grep -n "notice-archeomed" "$JOURNAL" | head -50 || true
          if grep -qE "PHP (Fatal|Parse) error" "$JOURNAL"; then
            echo "::error::Erreur fatale au journal de WordPress."
            grep -E "PHP (Fatal|Parse) error" "$JOURNAL" | cut -c1-500 | sed 's/^/::error::/'
            exit 1
          fi

  publier:
    # Seule une étiquette publie, et seulement si le site d'essai a tenu.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [analyser, essayer]
    runs-on: ubuntu-latest
    permissions:
      # Le jeton fourni par GitHub suffit à créer une release : aucune clé à
      # déposer dans les secrets du dépôt.
      contents: write

    steps:
      - name: Prendre le code de l'étiquette
        uses: actions/checkout@v4

      - name: Vérifier la syntaxe avant de publier
        run: ./verifier-la-syntaxe notice-archeomed/*.php

      - name: Vérifier que l'étiquette dit la même version que le plugin
        run: |
          set -eu
          ENTETE=$(sed -n 's/^ \* Version: *//p' notice-archeomed/notice-archeomed.php | head -1)
          ETIQUETTE="${GITHUB_REF_NAME#v}"
          echo "en-tête : $ENTETE — étiquette : $ETIQUETTE"
          if [ "$ENTETE" != "$ETIQUETTE" ]; then
            echo "::error::L'étiquette $GITHUB_REF_NAME ne correspond pas au « Version: $ENTETE » de l'en-tête."
            echo "WordPress compare les numéros de l'en-tête : publier ces deux-là ferait annoncer une version que l'archive ne porte pas."
            exit 1
          fi

      - name: Fabriquer l'archive
        run: ./empaqueter

      - name: Publier la release avec son archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" notice-archeomed.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(git log -1 --pretty=%B)"
